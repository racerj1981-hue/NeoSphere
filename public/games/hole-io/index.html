<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hole.io</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameContainer {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #f8fafc;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .progress-bar-container {
      width: 240px;
      height: 8px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 9999px;
      transition: width 0.2s ease;
    }
  </style>
  <script src="UnityLoader.js"></script>
</head>
<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Hole.io...</div>
    <div class="progress-bar-container">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div id="gameContainer"></div>

  <script>
    var progressFill = document.getElementById("progressFill");
    var loadingOverlay = document.getElementById("loadingOverlay");

    function customProgress(gameInstance, progress) {
      if (progressFill) {
        progressFill.style.width = Math.min(100, Math.round(progress * 100)) + "%";
      }
      if (progress >= 1) {
        setTimeout(function() {
          if (loadingOverlay) {
            loadingOverlay.style.opacity = "0";
            setTimeout(function() {
              loadingOverlay.style.display = "none";
            }, 400);
          }
        }, 500);
      }
    }

    var gameInstance = UnityLoader.instantiate("gameContainer", "hole.json", {
      onProgress: customProgress,
      Module: {
        onRuntimeInitialized: function() {
          customProgress(gameInstance, 1);
        }
      }
    });
  </script>
</body>
</html>
