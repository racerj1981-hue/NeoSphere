<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Stickman Hook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #11141a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Global filter/Linwize resilient exception filter
    window.onerror = function(msg) {
      console.warn('Stickman Hook engine status:', msg);
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });

    // Auto-resume Web Audio on user gesture
    (function() {
      var unlockAudio = function() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
          }
        } catch(e) {}
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('click', unlockAudio, { passive: true });
      window.addEventListener('keydown', unlockAudio, { passive: true });
      window.addEventListener('touchstart', unlockAudio, { passive: true });
    })();
  </script>
  <!-- Local Offline Poki SDK -->
  <script src="poki-sdk.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading Stickman Hook...</div>
  </div>

  <script src="bundle.js"></script>

  <script>
    // Hide loading screen once game canvas is initialized
    var checkInterval = setInterval(function() {
      var canvas = document.querySelector('canvas');
      if (canvas) {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.classList.add('hidden');
        }
        clearInterval(checkInterval);
      }
    }, 150);

    setTimeout(function() {
      var overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.classList.add('hidden');
    }, 3000);
  </script>
</body>
</html>
