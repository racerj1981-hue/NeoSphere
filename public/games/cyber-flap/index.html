<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Flap - Linewize Unblocked</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a16;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #fff;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .stat-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #c084fc;
      font-weight: bold;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
    }
    .linewize-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 22, 0.88);
      backdrop-filter: blur(12px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      pointer-events: auto;
    }
    .title-glitch {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 400px;
      line-height: 1.5;
    }
    .btn-play {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border: none;
      padding: 14px 44px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(168, 85, 247, 0.7);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="stat-badge">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="hudScore">0</div>
      </div>
      <div class="linewize-badge">
        <div class="pulse-dot"></div>
        <span>Linewize Bypass • 100% Offline</span>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="hudHighScore">0</div>
      </div>
    </div>
    <div style="text-align: center; font-size: 12px; color: #94a3b8;">
      Press <span style="background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color:#fff;">Spacebar</span> or <span style="background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color:#fff;">Click</span> to Flap
    </div>
  </div>

  <div class="screen-overlay" id="startScreen">
    <h1 class="title-glitch">CYBER FLAP</h1>
    <div class="linewize-badge" style="margin-bottom: 16px;">
      <div class="pulse-dot"></div>
      <span>100% Linewize Safe • Local Synth Audio</span>
    </div>
    <p class="subtitle">
      Navigate your glowing cyber drone through laser gates. Zero network calls, zero external scripts — plays through any school firewall.
    </p>
    <button class="btn-play" onclick="startGame()">START GAME</button>
  </div>

  <div class="screen-overlay hidden" id="gameOverScreen">
    <h1 class="title-glitch" style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SYSTEM CRASH</h1>
    <div style="margin: 18px 0;" class="stat-badge">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="finalScore" style="font-size: 32px; color: #ec4899;">0</div>
    </div>
    <div style="margin-bottom: 24px; font-size: 13px; color: #a1a1aa;" id="bestNotice">Best: 0</div>
    <button class="btn-play" onclick="startGame()">TRY AGAIN (SPACE)</button>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (type === 'flap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'score') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'START';
    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_flap_best') || '0', 10);
    document.getElementById('hudHighScore').innerText = highScore;

    const bird = {
      x: 100,
      y: 300,
      vy: 0,
      radius: 16,
      gravity: 950,
      jump: -360,
      rotation: 0
    };

    let pipes = [];
    let particles = [];
    const PIPE_SPEED = 210;
    const PIPE_SPACING = 280;
    const PIPE_GAP = 160;

    function jump() {
      initAudio();
      if (state === 'PLAYING') {
        bird.vy = bird.jump;
        playSound('flap');
        // create booster particle
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: bird.x - 10,
            y: bird.y,
            vx: -Math.random() * 80 - 40,
            vy: (Math.random() - 0.5) * 60,
            size: Math.random() * 5 + 3,
            color: '#00ffff',
            life: 1.0
          });
        }
      } else if (state === 'GAMEOVER') {
        startGame();
      } else if (state === 'START') {
        startGame();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'BUTTON') {
        jump();
      }
    });

    function startGame() {
      initAudio();
      state = 'PLAYING';
      score = 0;
      bird.x = Math.min(width * 0.25, 140);
      bird.y = height * 0.45;
      bird.vy = 0;
      pipes = [];
      particles = [];

      for (let i = 0; i < 4; i++) {
        createPipe(width + 200 + i * PIPE_SPACING);
      }

      document.getElementById('hudScore').innerText = '0';
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function createPipe(x) {
      const minTop = 80;
      const maxTop = height - PIPE_GAP - 80;
      const topHeight = Math.random() * (maxTop - minTop) + minTop;
      pipes.push({
        x: x,
        width: 60,
        top: topHeight,
        bottom: topHeight + PIPE_GAP,
        passed: false
      });
    }

    function gameOver() {
      state = 'GAMEOVER';
      playSound('hit');
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_flap_best', highScore.toString());
        document.getElementById('hudHighScore').innerText = highScore;
        document.getElementById('bestNotice').innerHTML = '<span style="color:#a855f7;font-weight:bold;">★ NEW HIGH SCORE! ★</span>';
      } else {
        document.getElementById('bestNotice').innerText = 'Best: ' + highScore;
      }
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    let lastTime = performance.now();

    function loop(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      if (state === 'PLAYING') {
        bird.vy += bird.gravity * dt;
        bird.y += bird.vy * dt;
        bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.003));

        if (bird.y - bird.radius <= 0 || bird.y + bird.radius >= height) {
          gameOver();
        }

        // Update pipes
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          p.x -= PIPE_SPEED * dt;

          if (!p.passed && p.x + p.width < bird.x) {
            p.passed = true;
            score++;
            playSound('score');
            document.getElementById('hudScore').innerText = score;
          }

          // Collision Check
          if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + p.width
          ) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
              gameOver();
            }
          }
        }

        // Recycle pipes
        if (pipes.length > 0 && pipes[0].x + pipes[0].width < -50) {
          pipes.shift();
          const lastX = pipes[pipes.length - 1].x;
          createPipe(lastX + PIPE_SPACING);
        }
      }

      // Update particles
      for (let pt of particles) {
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt * 2;
      }
      particles = particles.filter(pt => pt.life > 0);

      // Render
      ctx.fillStyle = '#090a16';
      ctx.fillRect(0, 0, width, height);

      // Background neon grid lines
      ctx.strokeStyle = 'rgba(168, 85, 247, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Render Pipes (Laser Columns)
      for (let p of pipes) {
        // Top Pipe
        const topGrad = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        topGrad.addColorStop(0, '#7000ff');
        topGrad.addColorStop(0.5, '#ec4899');
        topGrad.addColorStop(1, '#7000ff');
        ctx.fillStyle = topGrad;
        ctx.fillRect(p.x, 0, p.width, p.top);
        ctx.strokeStyle = '#f472b6';
        ctx.strokeRect(p.x, 0, p.width, p.top);

        // Bottom Pipe
        ctx.fillStyle = topGrad;
        ctx.fillRect(p.x, p.bottom, p.width, height - p.bottom);
        ctx.strokeStyle = '#f472b6';
        ctx.strokeRect(p.x, p.bottom, p.width, height - p.bottom);
      }

      // Render Particles
      for (let pt of particles) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
      }

      // Render Bird / Cyber Drone
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Drone Glow
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius * 1.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
      ctx.fill();

      // Drone Body
      const droneGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, bird.radius);
      droneGrad.addColorStop(0, '#ffffff');
      droneGrad.addColorStop(0.5, '#00f0ff');
      droneGrad.addColorStop(1, '#0066cc');
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fillStyle = droneGrad;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Drone Eye / Lens
      ctx.fillStyle = '#ff007b';
      ctx.beginPath();
      ctx.arc(6, -2, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
