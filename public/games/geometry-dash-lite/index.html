<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Geometry Dash Lite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-container {
      margin-bottom: 28px;
      text-align: center;
    }
    .logo-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      margin-bottom: 6px;
    }
    .logo-sub {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .progress-box {
      width: 280px;
      max-width: 85vw;
      height: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(99, 102, 241, 0.5);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
      border-radius: 999px;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 12px #38bdf8;
    }
    .loading-text {
      margin-top: 14px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
  <script>
    // Linwize filter and error resilient wrapper
    window.onerror = function(msg) {
      console.warn('GD Engine:', msg);
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });

    // Auto-unlock Web Audio on first user interaction
    (function() {
      var unlockAudio = function() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
          }
        } catch(e) {}
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('click', unlockAudio, { passive: true });
      window.addEventListener('keydown', unlockAudio, { passive: true });
      window.addEventListener('touchstart', unlockAudio, { passive: true });
    })();
  </script>
  <script src="Build/UnityLoader.js"></script>
</head>
<body>
  <div id="loader">
    <div class="logo-container">
      <div class="logo-title">Geometry Dash</div>
      <div class="logo-sub">Lite Edition</div>
    </div>
    <div class="progress-box">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="loading-text" id="status-text">Loading game assets...</div>
  </div>

  <div id="gameContainer"></div>

  <script>
    var progressBar = document.getElementById('progress-bar');
    var statusText = document.getElementById('status-text');
    var loader = document.getElementById('loader');

    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/GeometryDashLite.json", {
      onProgress: function(instance, progress) {
        var pct = Math.round(progress * 100);
        if (progressBar) progressBar.style.width = pct + '%';
        if (statusText) {
          if (pct < 100) {
            statusText.textContent = 'Loading rhythm platformer... ' + pct + '%';
          } else {
            statusText.textContent = 'Launching Geometry Dash Lite...';
          }
        }
        if (progress >= 1) {
          setTimeout(function() {
            if (loader) loader.classList.add('hidden');
          }, 800);
        }
      }
    });

    // Fallback safety timeout in case progress events finish early
    setTimeout(function() {
      var canvas = document.querySelector('#gameContainer canvas');
      if (canvas && loader) {
        loader.classList.add('hidden');
      }
    }, 4000);
  </script>
</body>
</html>
